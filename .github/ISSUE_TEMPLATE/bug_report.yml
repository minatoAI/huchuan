name: Bug
description: 报告一个问题（崩溃、传不动、装不上）
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        先确认不是已知限制：Android 只支持 arm64-v8a；Windows 需要 WebView2 Runtime；
        跨网传输取决于两端 NAT，局域网以外本来就容易不通。

  - type: input
    id: version
    attributes:
      label: 版本
      description: 发布页上的版本号，或者 APK / 压缩包文件名
      placeholder: v0.1.0
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options:
        - Android
        - Windows
        - 两端互通（Android ↔ Windows）
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 系统版本
      placeholder: Android 13（API 33）/ Windows 11 24H2
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: 现象
      description: 看到什么、期望什么。传文件的问题写清两端是同机、同局域网还是跨网。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 建群
        2. 另一台输入邀请码后 8 位加入
        3. 共享 32 MiB 文件
        4. 没有进度 / 卡在 0%
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志（可选）
      description: |
        Android：adb logcat -s Huchuan 的输出；Windows：daemon 日志里 pid 与端口附近的行。
        贴之前删掉邀请码、群名、公网 IP、设备名。
      render: text
    validations:
      required: false
