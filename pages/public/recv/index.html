<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>互传</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, "Segoe UI", sans-serif; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: Canvas; color: CanvasText; }
  main { width: min(92vw, 32rem); display: grid; gap: .75rem; }
  h1 { margin: 0; font-size: 1.05rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  p { margin: 0; font-size: .95rem; font-variant-numeric: tabular-nums; opacity: .8; }
  .track { height: .3rem; border-radius: 999px; overflow: hidden; }
  .track[data-on="1"] { background: color-mix(in srgb, CanvasText 12%, transparent); }
  .bar { height: 100%; width: 0; background: color-mix(in srgb, CanvasText 65%, transparent); }
  button { justify-self: start; padding: .5rem 1.1rem; border: 0; border-radius: .5rem; background: CanvasText; color: Canvas; font: inherit; cursor: pointer; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1 id="name">正在连接</h1>
  <p id="status" role="status" aria-live="polite">正在连接</p>
  <div class="track" aria-hidden="true"><div class="bar" id="bar"></div></div>
  <button id="retry" type="button" hidden>重试</button>
</main>
<script src="/recv/app.js"></script>
</body>
</html>
